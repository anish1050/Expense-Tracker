name: ci

on:
  push:
    branches: [master, staging, production]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service:
              - 'service/**'
              - 'shared/**'
            android:
              - 'android/**'
              - 'shared/**'

  service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle testPlayDebugUnitTest assemblePlayDebug assembleFossDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            android/app/build/outputs/apk/play/debug/app-play-debug.apk
            android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 14
